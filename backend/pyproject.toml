[project]
name = "platform-backend"
version = "0.1.0"
description = "多 Agent 协调平台后端（规格书见 docs/）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "anthropic>=0.34",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=43",
    "python-multipart>=0.0.32",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
platform = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_model: 需要真实模型密钥的冒烟测试（默认跳过）"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
disallow_subclassing_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "alembic"]
ignore_missing_imports = true
