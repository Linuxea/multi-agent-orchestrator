# 团队编队场景（第四期）：会话绑定团队 → 协调者以剧本为骨架制定计划
# S1 调研 → S2 成稿；S3（审校）故意无任务映射 → deviates_from_playbook=["S3"]
# 首次 propose_plan 故意引用不存在阶段 SX → 被引擎拒绝 → 修正后重新提出
scopes:
  - match:
      system_contains: "编队"
    steps:
      - tool_calls:
          - name: propose_plan
            input:
              rationale: "先按剧本骨架排（此版故意引用错阶段试探引擎校验）"
              tasks:
                - key: T1
                  title: 市场调研
                  agent_slug: web-researcher
                  playbook_stage_key: SX
                  acceptance_criteria: ["给出 2 个带来源的结论"]
      - tool_calls:
          - name: propose_plan
            input:
              rationale: "按剧本 S1→S2 骨架排计划；S3 审校本轮不需要，记为偏离"
              tasks:
                - key: T1
                  title: 市场调研
                  agent_slug: web-researcher
                  playbook_stage_key: S1
                  acceptance_criteria: ["给出 2 个带来源的结论"]
                - key: T2
                  title: 撰写简报
                  agent_slug: writer
                  depends_on: [T1]
                  playbook_stage_key: S2
                  acceptance_criteria: ["简报结构完整"]
      - text: "计划已提交。"
      - tool_calls:
          - name: dispatch
            input:
              rationale: "调研先行"
              task_key: T1
              agent_slug: web-researcher
              objective: 调研市场并给出带来源结论
              context: 用户需要一份简报
              acceptance_criteria: ["给出 2 个带来源的结论"]
              deliverable_format: markdown
              deliverable_name: research.md
              selection_rationale: 调研员擅长带来源调研
      - text: "T1 已派发。"
      - tool_calls:
          - name: read_artifact
            input:
              rationale: "复核前先读交付物"
              task_key: T1
              mode: summary
          - name: review
            input:
              rationale: "逐条核对验收标准"
              task_key: T1
              review:
                verdict: pass
                criteria:
                  - {criterion: "给出 2 个带来源的结论", result: pass}
      - text: "T1 复核通过。"
      - tool_calls:
          - name: dispatch
            input:
              rationale: "调研就绪，进入成稿阶段"
              task_key: T2
              agent_slug: writer
              objective: 基于调研撰写简报
              context: 上游已有调研交付物
              inputs:
                - artifact_id: "{{artifact:T1}}"
                  usage: 调研结论
              acceptance_criteria: ["简报结构完整"]
              deliverable_format: markdown
              deliverable_name: brief.md
              selection_rationale: 撰稿人擅长成稿
      - text: "T2 已派发。"
      - tool_calls:
          - name: read_artifact
            input:
              rationale: "复核前先读交付物"
              task_key: T2
              mode: summary
          - name: review
            input:
              rationale: "逐条核对验收标准"
              task_key: T2
              review:
                verdict: pass
                criteria:
                  - {criterion: "简报结构完整", result: pass}
      - text: "T2 复核通过。"
      - tool_calls:
          - name: finalize
            input:
              rationale: "全部任务已采纳（S3 审校记入偏离）"
              answer: "简报已完成，引用 [T1][T2]。"
              citations:
                - {task_key: T1}
                - {task_key: T2}
              gaps: ""
      - text: "汇总完成。"
  - match:
      system_contains: "调研员"
    steps:
      - tool_calls:
          - name: submit_report
            input:
              status: done
              summary: "完成调研：2 个带来源结论"
              deliverables:
                - {name: research.md, content: "# 调研\n\n结论 1/2（均含来源）", summary: "调研结论"}
              criteria_self_check:
                - {criterion: "给出 2 个带来源的结论", met: true}
              evidence: ["https://example.com/a"]
              attempted: ["检索示例来源"]
  - match:
      system_contains: "撰稿人"
    steps:
      - tool_calls:
          - name: submit_report
            input:
              status: done
              summary: "简报已按调研结论成稿"
              deliverables:
                - {name: brief.md, content: "# 简报\n\n基于调研的两条结论展开。", summary: "简报正文"}
              criteria_self_check:
                - {criterion: "简报结构完整", met: true}
              attempted: ["引用上游调研"]
