# 多领域调研场景（E2E happy path）
# 主 agent：提出计划 → 派发 T1 → 复核 → 派发 T2 → 复核 → 汇总
# 子 agent：researcher / writer 各提交一份 done 回报
scopes:
  - match:
      system_contains: "主管"
    steps:
      - tool_calls:
          - name: propose_plan
            input:
              rationale: "拆成调研与撰写两个串行任务"
              tasks:
                - key: T1
                  title: 市场调研
                  agent_slug: web-researcher
                  acceptance_criteria: ["至少给出 3 个有来源的结论"]
                - key: T2
                  title: 撰写报告
                  agent_slug: writer
                  depends_on: [T1]
                  acceptance_criteria: ["报告结构完整且有来源引用"]
      - text: "计划已提交。"
      - tool_calls:
          - name: dispatch
            input:
              rationale: "调研先行"
              task_key: T1
              agent_slug: web-researcher
              objective: 调研市场并给出带来源的结论
              context: 用户需要一份简报
              acceptance_criteria: ["至少给出 3 个有来源的结论"]
              deliverable_format: markdown
              deliverable_name: research.md
              selection_rationale: researcher 擅长带来源调研
      - text: "T1 已派发，等待回报。"
      - tool_calls:
          - name: read_artifact
            input:
              rationale: "复核前先读交付物"
              task_key: T1
              mode: summary
          - name: review
            input:
              rationale: "逐条核对验收标准"
              task_key: T1
              review:
                verdict: pass
                criteria:
                  - {criterion: "至少给出 3 个有来源的结论", result: pass}
      - text: "T1 复核通过。"
      - tool_calls:
          - name: dispatch
            input:
              rationale: "调研就绪，开始撰写"
              task_key: T2
              agent_slug: writer
              objective: 基于调研结果撰写报告
              context: 上游已有调研交付物
              inputs:
                - artifact_id: "{{artifact:T1}}"
                  usage: 调研结论
              acceptance_criteria: ["报告结构完整且有来源引用"]
              deliverable_format: markdown
              deliverable_name: report.md
              selection_rationale: writer 擅长成稿
      - text: "T2 已派发。"
      - tool_calls:
          - name: read_artifact
            input:
              rationale: "复核前先读交付物"
              task_key: T2
              mode: summary
          - name: review
            input:
              rationale: "逐条核对验收标准"
              task_key: T2
              review:
                verdict: pass
                criteria:
                  - {criterion: "报告结构完整且有来源引用", result: pass}
      - text: "T2 复核通过，全部完成。"
      - tool_calls:
          - name: finalize
            input:
              rationale: "全部任务已采纳，汇总答复"
              answer: "报告已完成，见交付物。引用 [T1][T2]。"
              citations:
                - {task_key: T1}
                - {task_key: T2}
              gaps: ""
      - text: "汇总完成。"
  - match:
      system_contains: "网络调研员"
    steps:
      - tool_calls:
          - name: submit_report
            input:
              status: done
              summary: "完成调研：3 个带来源结论"
              deliverables:
                - {name: research.md, content: "# 调研\n\n结论 1/2/3（均含来源）", summary: "调研结论"}
              criteria_self_check:
                - {criterion: "至少给出 3 个有来源的结论", met: true}
              evidence: ["https://example.com/a"]
              attempted: ["检索示例来源"]
  - match:
      system_contains: "撰稿人"
    steps:
      - tool_calls:
          - name: submit_report
            input:
              status: done
              summary: "报告已按调研结论成稿"
              deliverables:
                - {name: report.md, content: "# 报告\n\n基于调研的三条结论展开。", summary: "报告正文"}
              criteria_self_check:
                - {criterion: "报告结构完整且有来源引用", met: true}
              attempted: ["引用上游调研"]
